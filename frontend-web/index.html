      // Immediately enforce Stealth Monochromatic Dark Gray Theme & purge legacy light cache
      try {
        localStorage.setItem('pcm_theme_preference', 'dark');

      document.documentElement.classList.add('dark');
      document.documentElement.classList.remove('light');
    </script>
