version: '3.8'

services:
  # MySQL 8.4 Relational Database
  mysql:
    image: mysql:8.4
    container_name: pcm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-product_code_manager}
      MYSQL_USER: ${MYSQL_USER:-pcm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pcm_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pcm-network

  # Spring Boot 3.4 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pcm-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-product_code_manager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pcm_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pcm_password}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_INITIAL_USERNAME: ${ADMIN_INITIAL_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-Admin@123}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-123456789}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-abcdef}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-products}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pcm-network

  # React Vite Web Frontend
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: pcm-frontend-web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - pcm-network

volumes:
  mysql_data:
    driver: local

networks:
  pcm-network:
    driver: bridge
